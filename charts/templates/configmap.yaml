apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-config
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Sentinel information
    sentinel:
      name: {{ tpl .Values.config.sentinel.name . | quote }}

    # Debug configuration
    debug_config: {{ .Values.config.debugConfig }}

    # Logging configuration
    log:
      level: {{ .Values.config.log.level | quote }}
      format: {{ .Values.config.log.format | quote }}
      output: {{ .Values.config.log.output | quote }}

    # Client configurations
    clients:
      # HyperFleet API client
      hyperfleet_api:
        base_url: {{ .Values.config.clients.hyperfleetApi.baseUrl | quote }}
        version: {{ .Values.config.clients.hyperfleetApi.version | quote }}
        timeout: {{ .Values.config.clients.hyperfleetApi.timeout | quote }}
        {{- if .Values.config.clients.hyperfleetApi.auth.enabled }}
        auth:
          token_path: {{ .Values.config.clients.hyperfleetApi.auth.tokenPath | quote }}
          token_cache_ttl: {{ .Values.config.clients.hyperfleetApi.auth.tokenCacheTtl | quote }}
        {{- end }}

    # Sentinel configuration
    resource_type: {{ .Values.config.resourceType }}
    poll_interval: {{ .Values.config.pollInterval }}
    {{- if .Values.config.required_adapters }}
    required_adapters:
      {{- range .Values.config.required_adapters }}
      - {{ . }}
      {{- end }}
    {{- end }}

    {{- if .Values.config.resourceSelector }}
    # Resource selector for horizontal sharding
    resource_selector:
      {{- range .Values.config.resourceSelector }}
      - label: {{ .label }}
        value: {{ .value | quote }}
      {{- end }}
    {{- end }}

    {{- if .Values.config.messageDecision }}
    # Configurable CEL-based decision logic
    message_decision:
      {{- if .Values.config.messageDecision.params }}
      params:
        {{- range .Values.config.messageDecision.params }}
        - name: {{ .name }}
          expr: {{ .expr | quote }}
        {{- end }}
      {{- end }}
      result: {{ .Values.config.messageDecision.result | quote }}
    {{- end }}

    {{- if .Values.config.messageData }}
    # CloudEvents data payload configuration
    message_data:
      {{- toYaml .Values.config.messageData | nindent 6 }}
    {{- end }}
